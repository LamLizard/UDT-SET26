<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 3</title>
    <link rel="stylesheet" href="Bai3.css">
</head>

<body>
    <div class="text-format">
        <h1 class="text-format__title">Định dạng văn bản</h1>
        <div class="text-format__content">
            <div class="text-format__section">
                <span class="text-format__label">Hóa học:</span>
                <span class="text-format__text">
                    Nước: <span class="text-format__highlight">H<sub>2</sub>O</span> ;
                    Axit Sunfuric: <span class="text-format__highlight">H<sub>2</sub>SO<sub>4</sub></span>
                </span>
            </div>
            <div class="text-format__section">
                <span class="text-format__label">Toán học:</span>
                <span class="text-format__text">
                    Phương trình bậc 2:
                    <span class="text-format__highlight">ax<sup>2</sup> + bx + c = 0</span>
                </span>
            </div>
            <div class="text-format__section">
                <span class="text-format__label">Tin học:</span>
                <span class="text-format__text">Vòng lặp for:</span>
            </div>
            <div class="text-format__code-box">
                <p class="text-format__code-line">int tong = 0;</p>
                <p class="text-format__code-line">for(int i = 1; i &lt;= 10; i++)</p>
                <p class="text-format__code-line text-format__code-line--indent">tong += i;</p>
                <p class="text-format__code-line">printf("Tong cac so tu 1 =&gt; 10 la: %d\n",tong);</p>
            </div>
        </div>
    </div>
</body>

</html>
